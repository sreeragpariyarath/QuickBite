name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # 1. Backend Microservices CI
  backend:
    name: Backend CI (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, restaurant-service, order-service]
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_db

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        working-directory: services/${{ matrix.service }}
        run: pnpm exec prisma generate

      - name: Type Check
        working-directory: services/${{ matrix.service }}
        run: pnpm exec tsc --noEmit

      - name: Build Service
        working-directory: services/${{ matrix.service }}
        run: pnpm exec nest build

  # 2. Next.js Frontend CI
  frontend:
    name: Frontend CI (apps/web)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Type Check & Build
        working-directory: apps/web
        run: pnpm build

  # 3. Deploy to Self-Hosted Windows Runner
  deploy:
    name: Deploy to Self-Hosted Runner
    runs-on: self-hosted
    needs:
      - backend
      - frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show Runner Information
        shell: powershell
        run: |
          Write-Host "Hello from my self-hosted runner!"
          hostname
          whoami
          Get-Location

      - name: List Repository Files
        shell: powershell
        run: |
          Get-ChildItem
